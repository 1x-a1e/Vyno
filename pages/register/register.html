<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vyon — Registrazione</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@300;400;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/pages/register/css/register.css" />
  </head>

  <body class="vyon">
    <div class="bg" aria-hidden="true"></div>

    <main class="wrap">
      <section class="card" aria-labelledby="title">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Vyon</span>
        </div>

        <h1 id="title">Registrazione</h1>
        <p class="sub">Crea la tua identità nello spazio.</p>

        <form class="form" action="/api/register" method="post" enctype="multipart/form-data">
          <!-- Nome / Cognome -->
          <div class="grid">
            <div class="field">
              <label for="nome">Nome</label>
              <div class="input">
                <input id="nome" name="nome" type="text" required />
              </div>
            </div>

            <div class="field">
              <label for="cognome">Cognome</label>
              <div class="input">
                <input id="cognome" name="cognome" type="text" required />
              </div>
            </div>
          </div>

          <!-- Email -->
          <div class="field">
            <label for="email">Email</label>
            <div class="input">
              <input
                id="email"
                name="email"
                type="email"
                placeholder="nome@email.com"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div class="field">
            <label for="password">Password</label>
            <div class="input">
              <input
                id="password"
                name="password"
                type="password"
                minlength="12"
                placeholder="Minimo 12 caratteri"
                required
              />
            </div>
          </div>

          <!-- Username (opzionale) -->
          <div class="field">
            <label for="username">Username (opzionale)</label>
            <div class="input">
              <input
                id="username"
                name="usernameProfile"
                type="text"
                maxlength="16"
                placeholder="Generato automaticamente se vuoto"
              />
            </div>
          </div>

          <!-- Upload immagine -->
          <div class="field">
            <label for="img">Immagine profilo</label>

            <label class="upload">
              <input
                id="img"
                name="img"
                type="file"
                accept="image/*"
              />
              <span class="upload__icon">🖼</span>
              <span class="upload__text">
                Clicca per caricare un’immagine
              </span>
            </label>
          </div>

          <button class="btn primary" type="submit">
            Crea account
          </button>

          <p class="foot">
            Hai già un account?
            <a class="link accent" href="/login">Accedi</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
